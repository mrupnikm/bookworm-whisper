services:
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu
    #image: ghcr.io/remsky/kokoro-fastapi-gpu # Uncomment this line if you have a GPU and want to use it
    container_name: kokoro
    environment: #comment this section out if you are using the GPU image
      # ONNX Optimization Settings for vectorized operations
      - ONNX_NUM_THREADS=8 # Maximize core usage for vectorized ops
      - ONNX_INTER_OP_THREADS=4 # Higher inter-op for parallel matrix operations
      - ONNX_EXECUTION_MODE=parallel
      - ONNX_OPTIMIZATION_LEVEL=all
      - ONNX_MEMORY_PATTERN=true
      - ONNX_ARENA_EXTEND_STRATEGY=kNextPowerOfTwo
    # environment: #uncomment this section if you are using the GPU image
    #   - PYTHONPATH=/app:/app/api
    #   - USE_GPU=true
    #   - PYTHONUNBUFFERED=1
    ports:
      - 8880:8880
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8880/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  bookworm-whisper:
    image: bookworm-whisper
    container_name: bookworm-whisper
    # user: "1000:1000" # UID:GID - adjust to match your media user/group (run 'id' to check)
    environment:
      - OPENAI_BASE_URL=http://hornet:8880/v1
      - KOMGA_URL=http://komga:25600
      # - KOMGA_API_KEY=
      - AUDIOBOOKSHELF_URL=http://audiobookshelf:80
      # - AUDIOBOOKSHELF_API_KEY=
      - GLOBAL_SYNC_TIME=300 # Sync interval in seconds (0 to disable)
    ports:
      - 5001:5000
    volumes:
      - ./books:/app/books:rw
      - ./output:/app/output:rw
    depends_on:
      kokoro:
        condition: service_healthy
    restart: unless-stopped

  komga:
    image: gotson/komga
    container_name: komga
    # user: "1000:1000"
    volumes:
      - ./komga:/config
      - ./books:/data
    ports:
      - 25600:25600
    environment:
      - TZ=Europe/London
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:25600/actuator/health || exit 1",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped

  audiobookshelf:
    image: ghcr.io/advplyr/audiobookshelf:latest
    container_name: audiobookshelf
    # user: "1000:1000" # UID:GID - match with bookworm-whisper and komga for shared volume access
    ports:
      - 13378:80
    volumes:
      - ./output:/audiobooks:rw
      # - </path/to/podcasts>:/podcasts
      - ./audiobookshelf/config:/config:rw
      - ./audiobookshelf/metadata:/metadata:rw
    environment:
      - TZ=Europe/London
    restart: unless-stopped
