name: Build and push image on tag

on:
  push:
    tags:
      - "v*"

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Get image tag from Git tag
        id: get_version
        run: |
          RAW_VERSION="${GITHUB_REF#refs/tags/}"
          if [ -z "$RAW_VERSION" ]; then
            echo "Not triggered by a tag (GITHUB_REF='$GITHUB_REF')" >&2
            exit 1
          fi
          VERSION_FOR_TAG="${RAW_VERSION#v}"

          echo "RAW_VERSION=${RAW_VERSION}" >> "$GITHUB_ENV"
          echo "VERSION_FOR_TAG=${VERSION_FOR_TAG}" >> "$GITHUB_ENV"
          echo "version=${VERSION_FOR_TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v4
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ env.VERSION_FOR_TAG }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=tag,enable=${{ startsWith(github.ref, 'refs/tags/') }}

      - name: Build and push
        id: build-and-push
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Prepare release notes/body
        id: release_notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          set -e
          TAG=${GITHUB_REF#refs/tags/}

          git fetch --tags --force --depth=1 || true

          BODY=$(git for-each-ref --format='%(contents)' "refs/tags/$TAG" 2>/dev/null || true)

          if [ -z "$BODY" ]; then

            COMMIT=$(git rev-list -n 1 "refs/tags/$TAG" 2>/dev/null || git rev-parse --verify "$TAG" 2>/dev/null || true)
            if [ -n "$COMMIT" ]; then
              BODY=$(git show -s --format=%B "$COMMIT" 2>/dev/null || true)
            fi
          fi

          if [ -z "$BODY" ]; then
            BODY="Release $TAG"
          fi

          echo "release_body<<EOF" >> "$GITHUB_OUTPUT"
          echo "$BODY" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          echo "release_name=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ steps.release_notes.outputs.release_name }}" \
            --notes "${{ steps.release_notes.outputs.release_body }}"
